<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      color: #0f172a;
      overflow: hidden;
      user-select: none;
    }

    /* Giant projector number display */
    .display {
      font-size: 32vw;
      font-weight: 900;
      line-height: 0.9;
      text-align: center;
      color: #0284c7;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      transition: color 0.2s ease, transform 0.2s ease;
      margin-bottom: 3vh;
      white-space: nowrap;
    }

    /* Highlight color during final 3 seconds */
    .display.warning {
      color: #d97706;
      transform: scale(1.02);
    }

    /* Banner style when countdown completes */
    .display.times-up {
      color: #dc2626;
      font-size: 13vw;
      font-weight: 800;
      letter-spacing: 0.02em;
      animation: alertPulse 0.9s infinite alternate;
    }

    .controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    button {
      padding: 1.2rem 3rem;
      font-size: 1.75rem;
      font-weight: 700;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-start {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-start:hover:not(:disabled) {
      background-color: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-start:disabled {
      background-color: #e2e8f0;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset {
      background-color: #f1f5f9;
      color: #334155;
      border: 2px solid #cbd5e1;
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .shortcuts-hint {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.95rem;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .shortcuts-hint kbd {
      background: #f1f5f9;
      padding: 0.25rem 0.55rem;
      border-radius: 0.35rem;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-weight: 600;
    }

    @keyframes alertPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="display" id="timer">10</div>

  <div class="controls">
    <button class="btn-start" id="startBtn">Start</button>
    <button class="btn-reset" id="resetBtn">Reset</button>
  </div>

  <div class="shortcuts-hint">
    Shortcuts: <kbd>Space</kbd> Start &bull; <kbd>R</kbd> Reset &bull; <kbd>F</kbd> Fullscreen
  </div>

  <script>
    const INITIAL_TIME = 10;
    let timeLeft = INITIAL_TIME;
    let timerInterval = null;
    let audioCtx = null;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Initialize audio context on first interaction
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // High-pitched clock tick
    function playTick() {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // Game-show style buzzer
    function playBuzzer() {
      if (!audioCtx) return;

      const freqs = [150, 154];

      freqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.9);
      });
    }

    function updateDisplay() {
      timerDisplay.classList.remove('warning', 'times-up');

      if (timeLeft > 0) {
        timerDisplay.textContent = timeLeft;

        if (timeLeft <= 3) {
          timerDisplay.classList.add('warning');
        }
      } else {
        timerDisplay.textContent = "TIME'S UP!";
        timerDisplay.classList.add('times-up');
      }
    }

    function startTimer() {
      initAudio();
      if (timerInterval !== null || timeLeft === 0) return;

      startBtn.disabled = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft > 0) {
          playTick();
        } else {
          playBuzzer();
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timeLeft = INITIAL_TIME;
      startBtn.disabled = false;
      updateDisplay();
    }

    // Button Listeners
    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Presenter Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        startTimer();
      } else if (e.key.toLowerCase() === 'r') {
        resetTimer();
      } else if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      }
    });

    // Initial render
    updateDisplay();
  </script>

</body>
</html>
